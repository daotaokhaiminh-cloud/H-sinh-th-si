<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hệ Sinh Thái Bảo Hiểm – Kiểm tra và tối ưu hoá các quyền lợi bảo hiểm</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef3f1;--card:#fff;--ink:#0f2a2c;--mute:#536a6c;--line:#d8e2df;--deep:#0c2b2e;--jade:#1f7a6d;--gold:#b98a2b;--goldbg:#f7efd9;--bad:#b4402a;--badbg:#fbe9e4;--ok:#1f7a6d;--okbg:#e2f2ee;--inp:#f7faf9}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0a1517;--card:#112224;--ink:#e8f0ee;--mute:#93a9a9;--line:#23393b;--deep:#06100f;--jade:#3fb5a2;--gold:#e0b85a;--goldbg:#2a2412;--bad:#ef8a73;--badbg:#341c16;--ok:#4cc7b2;--okbg:#10302b;--inp:#0d1c1e}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0a1517;--card:#112224;--ink:#e8f0ee;--mute:#93a9a9;--line:#23393b;--deep:#06100f;--jade:#3fb5a2;--gold:#e0b85a;--goldbg:#2a2412;--bad:#ef8a73;--badbg:#341c16;--ok:#4cc7b2;--okbg:#10302b;--inp:#0d1c1e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Be Vietnam Pro',system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--deep);z-index:30}
.hero{background:var(--deep);color:#eaf3f1;padding:22px 18px 18px}
.hero small{color:#9fbcb8;font-size:12.5px}
.hero h1{margin:4px 0 4px;font-size:23px;line-height:1.25;font-weight:700}
.hero p{margin:0;color:#b8cfcb;font-size:13.5px;max-width:60ch}
.hr{display:flex;align-items:center;gap:16px;margin-top:16px}
.ring{--p:0;width:78px;height:78px;border-radius:50%;background:conic-gradient(#d9b45a calc(var(--p)*1%),#ffffff22 0);display:grid;place-items:center;flex:none}
.ring b{width:60px;height:60px;border-radius:50%;background:var(--deep);display:grid;place-items:center;font-size:17px;color:#fff}
.hr div.t{font-size:13px;color:#b8cfcb}.hr div.t strong{color:#fff;font-size:14.5px;display:block}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:999px;padding:7px 13px;font:600 13px 'Be Vietnam Pro',system-ui,sans-serif;cursor:pointer}
nav button.on{background:var(--deep);color:#fff;border-color:var(--deep)}
nav button i{font-style:normal;color:var(--gold);margin-right:4px}
main{max-width:860px;margin:0 auto;padding:16px 14px 90px}
h2{font-size:19px;margin:6px 0 2px}.sub{color:var(--mute);margin:0 0 14px;font-size:13.5px}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.c h3{margin:0 0 10px;font-size:15px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.f{display:block}.f span{display:block;font-size:12.5px;color:var(--mute);margin-bottom:3px}
input,textarea,select{width:100%;border:1px solid var(--line);background:var(--inp);color:var(--ink);border-radius:9px;padding:9px 10px;font:inherit}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
textarea{min-height:60px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--inp);color:var(--ink);border-radius:9px;padding:7px 11px;font:500 13px 'Be Vietnam Pro',system-ui,sans-serif;cursor:pointer}
.seg button.on{background:var(--jade);border-color:var(--jade);color:#fff}
.seg button.on.n{background:var(--bad);border-color:var(--bad)}.seg button.on.u{background:var(--gold);border-color:var(--gold)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}.row>span{flex:1}
.ck{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.ck:first-of-type{border-top:0}
.ck input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--jade);flex:none}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:4px 0 8px}.bar i{display:block;height:100%;background:var(--jade)}
.btn{border:0;border-radius:10px;padding:10px 15px;font:600 14px 'Be Vietnam Pro',system-ui,sans-serif;cursor:pointer;background:var(--deep);color:#fff}
.btn.g2{background:var(--goldbg);color:var(--gold);border:1px solid var(--gold)}.btn.x{background:none;color:var(--bad);padding:4px 8px}
.tip{background:var(--goldbg);border-left:3px solid var(--gold);padding:10px 12px;border-radius:8px;font-size:13.5px;margin:0 0 12px}
.tip.bad{background:var(--badbg);border-color:var(--bad)}.tip.ok{background:var(--okbg);border-color:var(--ok)}
details{border:1px solid var(--line);border-radius:11px;margin-top:8px;background:var(--inp)}

details[open]>summary{border-bottom:1px solid var(--line)}details>div{padding:10px 12px}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--okbg);color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 4px;border-top:1px solid var(--line);text-align:left}td:last-child,th:last-child{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;font-size:15.5px}
pre{white-space:pre-wrap;background:var(--inp);border:1px solid var(--line);border-radius:10px;padding:12px;font:12.5px/1.6 ui-monospace,monospace;max-height:340px;overflow:auto}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--mute)}
@media(prefers-reduced-motion:no-preference){.ring{transition:all .4s}}
.sync{display:inline-block;margin-top:12px;font-size:12px;padding:4px 10px;border-radius:99px;background:#ffffff1a;color:#cfe3df}.sync.ok{background:#1f7a6d55;color:#bdf2e6}.sync.bad{background:#b4402a66;color:#ffd9d0}.sync.w{background:#b98a2b55;color:#ffe9b8}

.hero{position:relative;overflow:hidden;padding:30px 20px 26px;background:radial-gradient(120% 90% at 85% -10%,#1f7a6d66,transparent 60%),radial-gradient(80% 60% at 0% 100%,#b98a2b33,transparent 60%),var(--deep)}
.hero::after{content:"";position:absolute;left:20px;right:20px;bottom:0;height:1px;background:linear-gradient(90deg,transparent,#d9b45a,transparent)}
.hero>*{max-width:740px;margin-left:auto;margin-right:auto}
.hero h1{font-size:34px;letter-spacing:-.01em;margin:6px auto 8px;font-weight:700}
.hero .lead{font-size:14.5px;color:#c4d8d4;max-width:740px;margin-bottom:4px}
.hero .hr{margin-top:20px}.hero .sync{display:block;width:fit-content;margin-left:max(0px,calc((100% - 740px)/2));margin-top:14px}
main{max-width:760px;padding-top:18px}
.ac{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;box-shadow:0 10px 26px -18px #0c2b2e88;overflow:hidden}
.ac.open{border-color:var(--gold)}
.ah{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:14px;width:100%;padding:16px;cursor:pointer;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink)}
.ah:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.no{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--gold);border:1.5px solid var(--gold);background:var(--goldbg)}
.ac.open .no{background:var(--gold);color:#fff}
.tx{flex:1;min-width:0}.tx b{display:block;font-size:16.5px;line-height:1.3}.tx small{color:var(--mute);font-size:13px;line-height:1.4;display:block}
.st{font-size:12px;color:var(--jade);font-weight:600;white-space:nowrap}
.ch{flex:none;width:9px;height:9px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);margin:0 4px 4px 0;transition:transform .2s}.ac.open .ch{transform:rotate(-135deg);margin:6px 4px 0 0}
.ab{padding:2px 14px 16px;border-top:1px solid var(--line);background:var(--bg)}.ab h2{display:none}.ab .sub{margin-top:12px}
.foot{text-align:center;color:var(--mute);font-size:12.5px;margin:20px 8px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 14px}
.choice button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:2px;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink)}
.choice button:focus-visible{outline:2px solid var(--gold)}
.choice b{font-size:16px}.choice small{color:var(--mute);font-size:12.5px}
.choice button.on{border-color:var(--jade);background:var(--okbg)}.choice button.on.no{border-color:var(--bad);background:var(--badbg)}
.ck1{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--mute);font-weight:700;margin-bottom:6px}.choice .on .ck1{background:var(--jade);color:#fff}.choice .on.no .ck1{background:var(--bad)}
.strip{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:#ffffff26;border-radius:14px;overflow:hidden;margin-bottom:12px}
.strip div{background:var(--deep);padding:12px 14px;color:#fff}.strip span{display:block;font-size:12px;color:#9fbcb8}.strip b{font-size:17px}.strip .gd b{color:#e8c36a}
.lc{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.lh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(100deg,var(--deep),#14464a);color:#fff}
.lh small{display:block;color:#e0b85a;font-size:12px}.lh b{font-size:16px}.lr{display:flex;align-items:center;gap:6px}.lt{font-size:13px;font-weight:600;color:#ffe3a0;white-space:nowrap}.lh .btn.x{color:#ffb4a3}
.lb{padding:14px}.lb h4{margin:18px 0 8px;font-size:14px;color:var(--jade);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.lb h4:first-child{margin-top:0}.lb h4 small{font-weight:400;color:var(--mute);font-size:12px}
.tiles{display:grid;gap:8px}.tile{border:1.5px solid var(--line);border-radius:13px;background:var(--inp);overflow:hidden}.tile.on{border-color:var(--jade);background:var(--card)}
.tl{display:flex;align-items:center;gap:12px;padding:11px 12px;cursor:pointer}
.ic{font-size:22px;width:38px;height:38px;display:grid;place-items:center;background:var(--bg);border-radius:10px;flex:none}
.tn{flex:1;min-width:0}.tn b{display:block;font-size:14.5px}.tn small{color:var(--mute);font-size:12.5px}
.sw{position:relative;width:46px;height:26px;flex:none}.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;padding:0;border:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .2s}.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px #0004}
.sw input:checked+i{background:var(--jade)}.sw input:checked+i::after{transform:translateX(20px)}.sw input:focus-visible+i{outline:2px solid var(--gold);outline-offset:2px}
.tf{padding:4px 12px 12px;border-top:1px dashed var(--line)}.tf .g{margin-top:10px}.wide{width:100%}
.lb .g,.tf .g{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
@media(max-width:380px){.choice{grid-template-columns:1fr}}

.cover{min-height:min(100svh,780px);display:flex;align-items:center;padding:40px 22px 34px;text-align:center}
.cover::before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;border:1px solid #d9b45a2e;right:-200px;top:-170px;box-shadow:0 0 0 60px #d9b45a0a,0 0 0 120px #d9b45a06;pointer-events:none}
.cv{width:100%;max-width:640px;position:relative}
.cover .kk{display:inline-flex;align-items:center;gap:12px;color:#e0b85a;font-size:14.5px;font-weight:600;letter-spacing:.04em}
.cover .kk::before,.cover .kk::after{content:"";width:30px;height:1px;background:#e0b85a}
.cover h1{font-size:clamp(24px,6.6vw,38px);line-height:1.28;font-weight:700;letter-spacing:.01em;margin:18px auto 14px;max-width:18em}
.cover .lead{font-size:15px;color:#c4d8d4;max-width:42ch;margin:0 auto}
.qt{margin:28px auto 0;padding:22px 18px 14px;border:1px solid #d9b45a55;border-radius:20px;background:#ffffff0d;max-width:520px;position:relative}
.qt::before{content:"\201C";display:block;font-size:56px;line-height:.8;height:26px;color:#e0b85a;font-weight:700}
.qt blockquote{cursor:pointer;margin:0;font-size:17.5px;line-height:1.6;color:#fff;font-weight:500;min-height:84px;display:flex;align-items:center;justify-content:center;transition:opacity .4s,transform .4s}
.qt blockquote.out{opacity:0;transform:translateY(6px)}
.dots{display:flex;flex-wrap:wrap;gap:0;justify-content:center;margin-top:8px}
.dots button{all:unset;box-sizing:content-box;width:6px;height:6px;border:4px solid transparent;border-radius:50%;background:#ffffff40;background-clip:padding-box;cursor:pointer}
.dots button.on{background:#e0b85a;background-clip:padding-box}.dots button:focus-visible{outline:2px solid #e0b85a}
.go{margin-top:26px;padding:15px 36px;border-radius:99px;border:0;background:linear-gradient(135deg,#efcc78,#b98a2b);color:#10201f;font:700 16px 'Be Vietnam Pro',system-ui,sans-serif;cursor:pointer;box-shadow:0 12px 30px -12px #e0b85acc;display:inline-flex;align-items:center;gap:10px}
.go i{width:8px;height:8px;border-right:2px solid #10201f;border-bottom:2px solid #10201f;transform:rotate(45deg);margin-bottom:3px}
.go:focus-visible{outline:2px solid #fff;outline-offset:3px}
.cover .bd{margin-top:24px;font-size:12.5px;color:#9fbcb8}
@media(prefers-reduced-motion:reduce){.qt blockquote{transition:none}}

.gc{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.gc.g-ok{border-left-color:var(--ok)}.gc.g-no{border-left-color:var(--bad)}.gc.g-u{border-left-color:var(--gold)}
.gt b{font-size:15.5px}.gq{margin:6px 0 10px;color:var(--mute);line-height:1.6;font-size:14px}
.gh{margin:0 0 10px;font-size:13px;background:var(--goldbg);padding:8px 10px;border-radius:9px;line-height:1.5}
.gs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gs button{all:unset;box-sizing:border-box;text-align:center;padding:10px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--inp);cursor:pointer;font:600 13px 'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);display:grid;gap:2px;justify-items:center}
.gs button span{font-size:22px}
.gs button.on.ok{background:var(--okbg);border-color:var(--ok)}.gs button.on.no{background:var(--badbg);border-color:var(--bad)}.gs button.on.u{background:var(--goldbg);border-color:var(--gold)}
.gs button:focus-visible{outline:2px solid var(--gold)}.gc details{margin-top:10px}
.story{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 16px 10px;margin-bottom:12px}
.sc{padding:16px 0;border-top:1px solid var(--line)}.sc:first-child{border-top:0}
.sc h3{margin:0 0 10px;font-size:17px}.sc:first-child h3{font-size:22px;color:var(--gold)}
.sc p{margin:0 0 11px;line-height:1.8;font-size:15px}
.sc ul,.sc ol{margin:0;padding-left:20px}.sc li{margin-bottom:9px;line-height:1.75}.sc li::marker{color:var(--gold);font-weight:700}
.rf{display:grid;gap:3px;padding:11px 13px;margin-bottom:8px;border-radius:12px;background:var(--goldbg)}.rf s{color:var(--mute);font-size:14px}.rf b{font-size:15px;line-height:1.55}
.sc.q .f{margin-top:14px}.sc.q .f span{color:var(--ink);font-size:14.5px;line-height:1.65;margin-bottom:6px}

.choice button.on.sn{border-color:var(--bad);background:var(--badbg)}.choice .on.sn .ck1{background:var(--bad);color:#fff}
.gs{grid-template-columns:repeat(5,1fr);gap:6px}.gs button{font-size:11.5px;padding:9px 2px}.gs button span{font-size:20px}
.gs button.on.s-ok{background:var(--okbg);border-color:var(--ok);color:var(--ink)}
.gs button.on.s-mid{background:#e8f3df;border-color:#7fb069;color:var(--ink)}

.gs button.on.s-no{background:var(--badbg);border-color:var(--bad);color:var(--ink)}
.gs button.on.s-hi{background:#f6d2c9;border-color:#a3321f;color:var(--ink)}
.gc.g-mid{border-left-color:#7fb069}.gc.g-hi{border-left-color:#a3321f}
.btn.pdf{background:linear-gradient(135deg,#efcc78,#b98a2b);color:#10201f;font-size:15px;margin:2px 0 12px}
.hs{text-align:left}.hero-svg{width:100%;height:auto;display:block;border-radius:16px;margin:10px 0 14px}
.motto{font-weight:600;color:var(--gold);font-size:16px;border-left:3px solid var(--gold);padding-left:12px;margin-top:14px!important}
.chart{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;background:var(--inp)}

.dc1{font-size:17px;font-weight:700;fill:var(--ink)}.dc2{font-size:10px;fill:var(--mute)}
@media screen{#pr{display:none}}
.pr-h{background:linear-gradient(110deg,#0c2b2e,#14464a);color:#fff;border-radius:12px;padding:18px 20px;margin-bottom:10px}
.pr-h small{color:#e0b85a;font-weight:600}.pr-h h1{font-size:19pt;line-height:1.25;margin:4px 0 6px}.pr-h p{margin:0;color:#c4d8d4;font-size:10.5pt}

function dmask(el){const t=el.value.replace(/\D/g,'').slice(0,8);el.value=t.length>4?t.slice(0,2)+'/'+t.slice(2,4)+'/'+t.slice(4):t.length>2?t.slice(0,2)+'/'+t.slice(2):t;if(t.length<8)return'';const d=+t.slice(0,2),m=+t.slice(2,4),y=+t.slice(4),dt=new Date(y,m-1,d);return y>=1900&&dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===d?`${t.slice(4)}-${t.slice(2,4)}-${t.slice(0,2)}`:''}

const JOBN={'Tài xế – vận tải – giao hàng':'Nghề cầm lái hằng ngày khiến nguy cơ tai nạn giao thông luôn ở rất gần, và khi nghỉ vì chấn thương thì thu nhập dừng ngay.','Công nhân – lao động sản xuất':'Môi trường sản xuất tiềm ẩn tai nạn lao động; chế độ từ BHXH giúp được một phần nhưng thường chưa đủ bù thu nhập và chi phí phục hồi.','Y tế (bác sĩ, điều dưỡng, dược)':'Làm trong ngành y, tiếp xúc nhiều nguồn bệnh và áp lực ca trực, nhưng người làm nghề y lại hay quên chăm chút chính mình.','Giáo viên – giảng viên':'Thu nhập đều đặn theo tháng là điểm tựa lớn, song nếu phải nghỉ dài ngày vì bệnh thì phần chênh lệch chi tiêu của gia đình vẫn rất đáng kể.','Công chức – viên chức':'Có BHXH, BHYT đầy đủ là lợi thế lớn; điều cần nhìn thêm là chi phí điều trị ngoài danh mục và nhu cầu chăm sóc sau tuổi hưu.','Nhân viên văn phòng':'Công việc ngồi nhiều và áp lực thời hạn dễ bào mòn sức khỏe theo năm tháng, nên lớp bảo vệ y tế đáng được quan tâm sớm.','Kỹ sư – IT – công nghệ':'Làm việc trí óc, ngồi lâu và hay thức khuya; thu nhập tốt nhưng sức khỏe mới là “tài sản” cần được bảo vệ đầu tiên.','Kinh doanh – bán hàng':'Thu nhập phụ thuộc doanh số và thường lên xuống theo mùa, lại phải đi lại nhiều, nên quỹ dự phòng và bảo hiểm tai nạn càng có ý nghĩa.','Tài chính – ngân hàng – kế toán':'Làm việc với con số và thời hạn gắt gao; áp lực kéo dài là điều cần được cân bằng bằng một nền bảo vệ vững.','Chủ doanh nghiệp – hộ kinh doanh':'Là người gánh cả công việc lẫn đội ngũ, nên khi ngừng làm việc thì dòng tiền của cả công việc kinh doanh có thể ngừng theo.','Lao động tự do – freelancer':'Không có đơn vị đóng BHXH thay, nghỉ ngày nào thu nhập ngày đó dừng, nên tự chủ động bảo vệ mình là điều rất quan trọng.','Nông nghiệp – lao động nông thôn':'Thu nhập theo mùa vụ, lại thường ở xa cơ sở y tế tuyến trên, nên khi có bệnh nặng chi phí đi lại và ăn ở cũng là gánh nặng đáng kể.','Nội trợ – nghỉ hưu – chưa đi làm':'Không có thu nhập riêng nên càng cần lớp bảo vệ sức khỏe ổn định để không phải phụ thuộc hoàn toàn vào con cháu.'};
